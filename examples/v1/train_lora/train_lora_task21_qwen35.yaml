# Qwen3.5 LoRA SFT for task21 tool-calling data.
# Run with:  USE_V1=1 llamafactory-cli sft examples/v1/train_lora/train_lora_task21_qwen35.yaml
#
# NOTE: replace `model` with the exact Qwen3.5 checkpoint you want
# (e.g. Qwen/Qwen3.5-4B-Instruct, or a local path).
#
# Field set kept intentionally minimal so this works on older v1 builds too.
# The only fields used are those present in v1 TrainingArguments since day one.
# Newer-only fields (warmup_ratio / logging_steps / save_steps / save_total_limit)
# are intentionally omitted — add them back if your v1 build supports them.

model: Qwen/Qwen3.5-4B-Instruct
model_class: llm

# Use qwen3_5 for the thinking variant, qwen3_5_nothink for instruct/chat.
template: qwen3_5_nothink

# PEFT
peft_config:
  name: lora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all

# Kernel
kernel_config:
  name: auto
  include_kernels: auto

# Distributed: keep enabled for multi-GPU; for single GPU, comment out the block.
dist_config:
  name: fsdp2
  dcp_path: null

### data
train_dataset: data/task21_dataset.yaml
eval_dataset: data/task21_eval.yaml

### training (minimal field set; works across v1 versions)
output_dir: ./outputs/task21_qwen35_lora
micro_batch_size: 1
cutoff_len: 4096           # tools schema is large; 2048 is risky
learning_rate: 1.0e-4
num_train_epochs: 3
bf16: true                 # H100 sweet spot

### sample
sample_backend: hf
max_new_tokens: 512
